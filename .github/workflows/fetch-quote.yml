name: Fetch Quote
on:
  schedule: # Run workflow automatically
    - cron: "0 0 * * *" 
  workflow_dispatch: # Run workflow manually (without waiting for the cron to be called), through the Github Actions Workflow page directly

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest quotes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Update contrib graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: nmahesh20
          outputs: |
            Assets/github-contribution-grid-snake-light.gif?palette=github-light
            Assets/github-contribution-grid-snake-dark.gif?palette=github-dark
      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          output-dir: Assets
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add Assets/
          if git diff --cached --quiet; then
            echo "The contrib grid is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "chore: draw the day's animations"
          git push --quiet
          
      # - uses: stefanzweifel/git-auto-commit-action@v7
      #   with:
      #     commit_message: "chore: update contribution snake animations"
      #     file_pattern: 'Assets/*'

      - name: Fetch Quotes
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "http://www.quotationspage.com/data/mqotd.rss"
          max_post_count: 4
          disable_html_encoding: true
          template: $newline $counter.  $description <br> &emsp;&emsp;&emsp; <i>-by $title</i> $newline
